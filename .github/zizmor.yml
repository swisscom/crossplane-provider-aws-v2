rules:
  # Every action must be pinned to a full commit SHA; Renovate keeps the pins current.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # PR caches are scoped to the PR ref, so they never reach main, and the
  # publish job restores no cache. Keep it that way when editing ci.yml.
  cache-poisoning:
    ignore:
      - ci.yml
