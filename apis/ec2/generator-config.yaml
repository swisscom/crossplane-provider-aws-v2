# ACK generator config of ec2, see docs/components/ack-code-generator.md.
# SecurityGroup follows the AWS/upjet model: rules are separate kinds
# (SecurityGroupIngressRule/SecurityGroupEgressRule) backed by the security
# group rule API (sgr-…), with flat source fields in custom_types.go instead
# of IpPermissions. List all kinds with
# `cd codegen && go run ./cmd/generate --service ec2 --list-kinds`.
operations:
    AuthorizeSecurityGroupIngress:
        resource_name: SecurityGroupIngressRule
        operation_type: Create
    AuthorizeSecurityGroupEgress:
        resource_name: SecurityGroupEgressRule
        operation_type: Create
    DescribeSecurityGroupRules:
        resource_name:
            - SecurityGroupIngressRule
            - SecurityGroupEgressRule
        operation_type: ReadMany
    ModifySecurityGroupRules:
        resource_name:
            - SecurityGroupIngressRule
            - SecurityGroupEgressRule
        operation_type: Update
    RevokeSecurityGroupIngress:
        resource_name: SecurityGroupIngressRule
        operation_type: Delete
    RevokeSecurityGroupEgress:
        resource_name: SecurityGroupEgressRule
        operation_type: Delete
resources:
    SecurityGroup:
        exceptions:
            errors:
                404:
                    code: InvalidGroup.NotFound
        fields:
            # Optional: defaults to metadata.name (preCreate).
            GroupName:
                is_required: false
            OwnerId:
                is_read_only: true
                from:
                    operation: DescribeSecurityGroups
                    path: SecurityGroups.OwnerId
            IpPermissions:
                is_read_only: true
                from:
                    operation: DescribeSecurityGroups
                    path: SecurityGroups.IpPermissions
            IpPermissionsEgress:
                is_read_only: true
                from:
                    operation: DescribeSecurityGroups
                    path: SecurityGroups.IpPermissionsEgress
    SecurityGroupIngressRule:
        exceptions:
            errors:
                404:
                    code: InvalidSecurityGroupRuleId.NotFound
    SecurityGroupEgressRule:
        exceptions:
            errors:
                404:
                    code: InvalidSecurityGroupRuleId.NotFound
ignore:
    field_paths:
        - CreateSecurityGroupInput.DryRun
        - DeleteSecurityGroupInput.DryRun
        - DescribeSecurityGroupsInput.DryRun
        - AuthorizeSecurityGroupIngressInput.DryRun
        - AuthorizeSecurityGroupEgressInput.DryRun
        - DescribeSecurityGroupRulesInput.DryRun
        - ModifySecurityGroupRulesInput.DryRun
        - RevokeSecurityGroupIngressInput.DryRun
        - RevokeSecurityGroupEgressInput.DryRun
        # tags: custom []Tag field, sent as TagSpecifications in preCreate
        - CreateSecurityGroupInput.TagSpecifications
        # rules: flat custom fields (custom_types.go) instead of IpPermissions;
        # GroupId is the custom, referenceable securityGroupID
        - AuthorizeSecurityGroupIngressInput.CidrIp
        - AuthorizeSecurityGroupIngressInput.GroupId
        - AuthorizeSecurityGroupIngressInput.GroupName
        - AuthorizeSecurityGroupIngressInput.IpPermissions
        - AuthorizeSecurityGroupIngressInput.SourceSecurityGroupName
        - AuthorizeSecurityGroupIngressInput.SourceSecurityGroupOwnerId
        - AuthorizeSecurityGroupIngressInput.TagSpecifications
        - AuthorizeSecurityGroupEgressInput.CidrIp
        - AuthorizeSecurityGroupEgressInput.GroupId
