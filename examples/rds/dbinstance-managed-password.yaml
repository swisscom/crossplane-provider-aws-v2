# PostgreSQL DBInstance whose master password RDS manages in AWS Secrets
# Manager (manageMasterUserPassword). The provider never sees the password:
# the connection Secret has an empty "password" key, and the secret's ARN is
# in status.atProvider.masterUserSecret. Don't set masterUserPasswordSecretRef
# or autogeneratePassword together with it at create; to turn management off
# later, set one of them in the same change.
apiVersion: rds.aws2.crossplane.io/v1alpha1
kind: DBInstance
metadata:
  namespace: default
  name: example-dbinstance-managed-password
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  writeConnectionSecretToRef:
    name: example-dbinstance-managed-password-conn
  forProvider:
    region: eu-central-1
    engine: postgres
    engineVersion: "16.4"
    dbInstanceClass: db.t4g.micro
    masterUsername: dbadmin
    manageMasterUserPassword: true
    # Optional: the KMS key that encrypts the secret (default: aws/secretsmanager).
    # masterUserSecretKMSKeyID: arn:aws:kms:eu-central-1:123456789012:key/REPLACE_ME
    allocatedStorage: 20
    storageType: gp3
    storageEncrypted: true
    dbSubnetGroupName: REPLACE_ME-db-subnet-group
    vpcSecurityGroupIDs:
      - sg-0123456789abcdef0
    publiclyAccessible: false
    applyImmediately: true
    skipFinalSnapshot: false
    finalDBSnapshotIdentifier: example-dbinstance-managed-password-final
