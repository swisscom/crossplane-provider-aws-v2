---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: grants.kms.aws2.crossplane.io
spec:
  group: kms.aws2.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - aws2
    kind: Grant
    listKind: GrantList
    plural: grants
    singular: grant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Grant is the Schema for the Grants API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GrantSpec defines the desired state of Grant
            properties:
              forProvider:
                description: GrantParameters defines the desired state of Grant
                properties:
                  constraints:
                    description: |-
                      Specifies a grant constraint.

                      Do not include confidential or sensitive information in this field. This
                      field may be displayed in plaintext in CloudTrail logs and other output.

                      KMS supports the following grant constraints.

                         * EncryptionContextEquals and EncryptionContextSubset — These encryption
                         context grant constraints allow the permissions in the grant only when
                         the encryption context in the request matches (EncryptionContextEquals)
                         or includes (EncryptionContextSubset) the encryption context specified
                         in the constraint. Encryption context grant constraints are supported
                         only on grant operations (https://docs.aws.amazon.com/kms/latest/developerguide/grants.html#terms-grant-operations)
                         that include an EncryptionContext parameter, such as cryptographic operations
                         on symmetric encryption KMS keys. You cannot use an encryption context
                         grant constraint for cryptographic operations with asymmetric KMS keys
                         or HMAC KMS keys. Operations with these keys don't support an encryption
                         context. Grants with encryption context grant constraints can include
                         the DescribeKey and RetireGrant operations, but the constraint doesn't
                         apply to these operations. If a grant with an encryption context grant
                         constraint includes the CreateGrant operation, the constraint requires
                         that any grants created with the CreateGrant permission have an equally
                         strict or stricter encryption context constraint. Each constraint value
                         can include up to 8 encryption context pairs. The encryption context value
                         in each constraint cannot exceed 384 characters. For more information
                         about encryption context, see Encryption context (https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#encrypt_context)
                         in the Key Management Service Developer Guide .

                         * SourceArn — This grant constraint allows the permissions in the grant
                         only when the request is made on behalf of a specific Amazon Web Services
                         resource, identified by its Amazon Resource Name (ARN) (https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
                         This is effectively the same as having the aws:SourceArn (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html#condition-keys-sourcearn)
                         global condition key in the grant. The SourceArn constraint is supported
                         on grants for all types of KMS keys and can also be applied to the DescribeKey
                         operation when specified in the request. However, it does not apply to
                         RetireGrant operation.

                      For information about grant constraints, see Using grant constraints (https://docs.aws.amazon.com/kms/latest/developerguide/create-grant-overview.html#grant-constraints)
                      in the Key Management Service Developer Guide.
                    properties:
                      encryptionContextEquals:
                        additionalProperties:
                          type: string
                        type: object
                      encryptionContextSubset:
                        additionalProperties:
                          type: string
                        type: object
                      sourceARN:
                        type: string
                    type: object
                  granteePrincipal:
                    description: |-
                      The identity that gets the permissions specified in the grant.

                      To specify the grantee principal, use the Amazon Resource Name (ARN) of an
                      Amazon Web Services principal. Valid principals include Amazon Web Services
                      accounts, IAM users, IAM roles, federated users, and assumed role users.
                      For help with the ARN syntax for a principal, see IAM ARNs (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-arns)
                      in the Identity and Access Management User Guide .

                      You must specify either GranteePrincipal or GranteeServicePrincipal, but
                      not both.
                    type: string
                  granteeServicePrincipal:
                    description: |-
                      The Amazon Web Services service principal (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html#principal-services)
                      that gets the permissions specified in the grant.

                      When you specify a GranteeServicePrincipal, you must also specify a SourceArn
                      grant constraint. In addition, you must specify either a RetiringPrincipal
                      or a RetiringServicePrincipal.

                      You must specify either GranteePrincipal or GranteeServicePrincipal, but
                      not both.
                    type: string
                  keyID:
                    description: |-
                      KeyID is the ID or ARN of the KMS key the grant is for. Set it, keyIDRef
                      or keyIDSelector. It can't be changed after creation.
                    type: string
                  keyIDRef:
                    description: KeyIDRef is a reference to a Key used to set KeyID.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  keyIDSelector:
                    description: KeyIDSelector selects a reference to a Key used to
                      set KeyID.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  name:
                    description: |-
                      A friendly name for the grant. Use this value to prevent the unintended creation
                      of duplicate grants when retrying this request.

                      Do not include confidential or sensitive information in this field. This
                      field may be displayed in plaintext in CloudTrail logs and other output.

                      When this value is absent, all CreateGrant requests result in a new grant
                      with a unique GrantId even if all the supplied parameters are identical.
                      This can result in unintended duplicates when you retry the CreateGrant request.

                      When this value is present, you can retry a CreateGrant request with identical
                      parameters; if the grant already exists, the original GrantId is returned
                      without creating a new grant. Note that the returned grant token is unique
                      with every CreateGrant request, even when a duplicate GrantId is returned.
                      All grant tokens for the same grant ID can be used interchangeably.
                    type: string
                  operations:
                    description: |-
                      A list of operations that the grant permits.

                      This list must include only operations that are permitted in a grant. Also,
                      the operation must be supported on the KMS key. For example, you cannot create
                      a grant for a symmetric encryption KMS key that allows the Sign operation,
                      or a grant for an asymmetric KMS key that allows the GenerateDataKey operation.
                      If you try, KMS returns a ValidationError exception. For details, see Grant
                      operations (https://docs.aws.amazon.com/kms/latest/developerguide/grants.html#terms-grant-operations)
                      in the Key Management Service Developer Guide.
                    items:
                      type: string
                    type: array
                  region:
                    description: Region is which region the Grant will be created.
                    type: string
                  retiringPrincipal:
                    description: |-
                      The principal that has permission to use the RetireGrant operation to retire
                      the grant.

                      To specify the principal, use the Amazon Resource Name (ARN) (https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html)
                      of an Amazon Web Services principal. Valid principals include Amazon Web
                      Services accounts, IAM users, IAM roles, federated users, and assumed role
                      users. For help with the ARN syntax for a principal, see IAM ARNs (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-arns)
                      in the Identity and Access Management User Guide .

                      The grant determines the retiring principal. Other principals might have
                      permission to retire the grant or revoke the grant. For details, see RevokeGrant
                      and Retiring and revoking grants (https://docs.aws.amazon.com/kms/latest/developerguide/grant-delete.html)
                      in the Key Management Service Developer Guide.

                      You can specify either RetiringPrincipal or RetiringServicePrincipal, but
                      not both.
                    type: string
                  retiringServicePrincipal:
                    description: |-
                      The Amazon Web Services service principal (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html#principal-services)
                      that has permission to use the RetireGrant operation to retire the grant.

                      You can specify either RetiringPrincipal or RetiringServicePrincipal, but
                      not both.
                    type: string
                required:
                - operations
                - region
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: GrantStatus defines the observed state of Grant.
            properties:
              atProvider:
                description: GrantObservation defines the observed state of Grant
                properties:
                  creationDate:
                    description: The date and time when the grant was created.
                    format: date-time
                    type: string
                  grantID:
                    description: |-
                      The unique identifier for the grant.

                      You can use the GrantId in a ListGrants, RetireGrant, or RevokeGrant operation.
                    type: string
                  issuingAccount:
                    description: The Amazon Web Services account under which the grant
                      was issued.
                    type: string
                  keyID:
                    description: The unique identifier for the KMS key to which the
                      grant applies.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
