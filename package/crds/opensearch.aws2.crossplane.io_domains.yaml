---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: domains.opensearch.aws2.crossplane.io
spec:
  group: opensearch.aws2.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - aws2
    kind: Domain
    listKind: DomainList
    plural: domains
    singular: domain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Domain is the Schema for the Domains API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DomainSpec defines the desired state of Domain
            properties:
              forProvider:
                description: DomainParameters defines the desired state of Domain
                properties:
                  accessPolicies:
                    description: |-
                      Identity and Access Management (IAM) policy document specifying the access
                      policies for the new domain.
                    type: string
                  advancedOptions:
                    additionalProperties:
                      type: string
                    description: |-
                      Key-value pairs to specify advanced configuration options. The following
                      key-value pairs are supported:

                         * "rest.action.multi.allow_explicit_index": "true" | "false" - Note the
                         use of a string rather than a boolean. Specifies whether explicit references
                         to indexes are allowed inside the body of HTTP requests. If you want to
                         configure access policies for domain sub-resources, such as specific indexes
                         and domain APIs, you must disable this property. Default is true.

                         * "indices.fielddata.cache.size": "80" - Note the use of a string rather
                         than a boolean. Specifies the percentage of heap space allocated to field
                         data. Default is unbounded.

                         * "indices.query.bool.max_clause_count": "1024" - Note the use of a string
                         rather than a boolean. Specifies the maximum number of clauses allowed
                         in a Lucene boolean query. Default is 1,024. Queries with more than the
                         permitted number of clauses result in a TooManyClauses error.

                         * "override_main_response_version": "true" | "false" - Note the use of
                         a string rather than a boolean. Specifies whether the domain reports its
                         version as 7.10 to allow Elasticsearch OSS clients and plugins to continue
                         working with it. Default is false when creating a domain and true when
                         upgrading a domain.

                      For more information, see Advanced cluster parameters (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/createupdatedomains.html#createdomain-configure-advanced-options).
                    type: object
                  advancedSecurityOptions:
                    description: Options for fine-grained access control.
                    properties:
                      anonymousAuthEnabled:
                        type: boolean
                      enabled:
                        type: boolean
                      iamFederationOptions:
                        description: Input parameters for configuring IAM identity
                          federation settings.
                        properties:
                          enabled:
                            type: boolean
                          rolesKey:
                            type: string
                          subjectKey:
                            type: string
                        type: object
                      internalUserDatabaseEnabled:
                        type: boolean
                      jwtOptions:
                        description: |-
                          The JWT authentication and authorization configuration for an Amazon OpenSearch
                          Service domain.
                        properties:
                          enabled:
                            type: boolean
                          jwksURL:
                            type: string
                          publicKey:
                            type: string
                          rolesKey:
                            type: string
                          subjectKey:
                            type: string
                        type: object
                      masterUserOptions:
                        description: Credentials for the master user for a domain.
                        properties:
                          masterUserARN:
                            description: |-
                              The Amazon Resource Name (ARN) of the domain. See Identifiers for IAM Entities
                              (https://docs.aws.amazon.com/IAM/latest/UserGuide/index.html) in Using Amazon
                              Web Services Identity and Access Management for more information.
                            type: string
                          masterUserName:
                            type: string
                        type: object
                      sAMLOptions:
                        description: The SAML authentication configuration for an
                          Amazon OpenSearch Service domain.
                        properties:
                          enabled:
                            type: boolean
                          idp:
                            description: The SAML identity povider information.
                            properties:
                              entityID:
                                type: string
                              metadataContent:
                                type: string
                            type: object
                          masterBackendRole:
                            type: string
                          masterUserName:
                            type: string
                          rolesKey:
                            type: string
                          sessionTimeoutMinutes:
                            format: int64
                            type: integer
                          subjectKey:
                            type: string
                        type: object
                    type: object
                  aimlOptions:
                    description: Options for all machine learning features for the
                      specified domain.
                    properties:
                      naturalLanguageQueryGenerationOptions:
                        description: |-
                          Container for parameters required to enable the natural language query generation
                          feature.
                        properties:
                          desiredState:
                            type: string
                        type: object
                      s3VectorsEngine:
                        description: Options for enabling S3 vectors engine features
                          on the specified domain.
                        properties:
                          enabled:
                            type: boolean
                        type: object
                      serverlessVectorAcceleration:
                        description: |-
                          Configuration for serverless vector acceleration, which provides GPU-accelerated
                          (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/gpu-acceleration-vector-index.html)
                          vector search capabilities for improved performance on vector workloads.
                        properties:
                          enabled:
                            type: boolean
                        type: object
                    type: object
                  autoTuneOptions:
                    description: Options for Auto-Tune.
                    properties:
                      desiredState:
                        description: The Auto-Tune desired state. Valid values are
                          ENABLED and DISABLED.
                        type: string
                      maintenanceSchedules:
                        items:
                          properties:
                            cronExpressionForRecurrence:
                              type: string
                            duration:
                              description: |-
                                The duration of a maintenance schedule. For more information, see Auto-Tune
                                for Amazon OpenSearch Service (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/auto-tune.html).
                              properties:
                                unit:
                                  description: The unit of a maintenance schedule
                                    duration. Valid value is HOUR.
                                  type: string
                                value:
                                  description: Integer that specifies the value of
                                    a maintenance schedule duration.
                                  format: int64
                                  type: integer
                              type: object
                            startAt:
                              format: date-time
                              type: string
                          type: object
                        type: array
                      rollbackOnDisable:
                        description: The rollback state while disabling Auto-Tune
                          for the domain.
                        type: string
                      useOffPeakWindow:
                        type: boolean
                    type: object
                  automatedSnapshotPauseOptions:
                    description: |-
                      Specifies the automated snapshot pause options for the domain.

                      Suspending snapshots reduces data protection. You cannot restore your domain
                      to points in time when snapshots are suspended. Use this feature only for
                      short-term operational needs such as migrations or maintenance windows.

                      Maximum suspension duration: 3 days.
                    properties:
                      enabled:
                        type: boolean
                      endTime:
                        format: date-time
                        type: string
                      startTime:
                        format: date-time
                        type: string
                    type: object
                  clusterConfig:
                    description: Container for the cluster configuration of a domain.
                    properties:
                      coldStorageOptions:
                        description: |-
                          Container for the parameters required to enable cold storage for an OpenSearch
                          Service domain. For more information, see Cold storage for Amazon OpenSearch
                          Service (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cold-storage.html).
                        properties:
                          enabled:
                            type: boolean
                        type: object
                      dedicatedMasterCount:
                        format: int64
                        type: integer
                      dedicatedMasterEnabled:
                        type: boolean
                      dedicatedMasterType:
                        type: string
                      instanceCount:
                        format: int64
                        type: integer
                      instanceType:
                        type: string
                      multiAZWithStandbyEnabled:
                        type: boolean
                      nodeOptions:
                        items:
                          properties:
                            nodeConfig:
                              description: |-
                                Configuration options for defining the setup of any node type within the
                                cluster.
                              properties:
                                count:
                                  format: int64
                                  type: integer
                                enabled:
                                  type: boolean
                                type_:
                                  type: string
                              type: object
                            nodeType:
                              type: string
                          type: object
                        type: array
                      warmCount:
                        format: int64
                        type: integer
                      warmEnabled:
                        type: boolean
                      warmType:
                        type: string
                      zoneAwarenessConfig:
                        description: The zone awareness configuration for an Amazon
                          OpenSearch Service domain.
                        properties:
                          availabilityZoneCount:
                            format: int64
                            type: integer
                        type: object
                      zoneAwarenessEnabled:
                        type: boolean
                    type: object
                  cognitoOptions:
                    description: |-
                      Key-value pairs to configure Amazon Cognito authentication. For more information,
                      see Configuring Amazon Cognito authentication for OpenSearch Dashboards (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cognito-auth.html).
                    properties:
                      enabled:
                        type: boolean
                      identityPoolID:
                        type: string
                      roleARN:
                        type: string
                      userPoolID:
                        type: string
                    type: object
                  deploymentStrategyOptions:
                    description: Specifies the deployment strategy options for the
                      domain.
                    properties:
                      deploymentStrategy:
                        description: |-
                          Specifies the deployment strategy for the domain. Valid values are Default
                          and CapacityOptimized.
                        type: string
                    type: object
                  domainEndpointOptions:
                    description: |-
                      Additional options for the domain endpoint, such as whether to require HTTPS
                      for all traffic.
                    properties:
                      customEndpoint:
                        type: string
                      customEndpointCertificateARN:
                        description: |-
                          The Amazon Resource Name (ARN) of the domain. See Identifiers for IAM Entities
                          (https://docs.aws.amazon.com/IAM/latest/UserGuide/index.html) in Using Amazon
                          Web Services Identity and Access Management for more information.
                        type: string
                      customEndpointEnabled:
                        type: boolean
                      enforceHTTPS:
                        type: boolean
                      tlsSecurityPolicy:
                        type: string
                    type: object
                  ebsOptions:
                    description: |-
                      Container for the parameters required to enable EBS-based storage for an
                      OpenSearch Service domain.
                    properties:
                      ebsEnabled:
                        type: boolean
                      iops:
                        format: int64
                        type: integer
                      throughput:
                        format: int64
                        type: integer
                      volumeSize:
                        format: int64
                        type: integer
                      volumeType:
                        description: |-
                          The type of EBS volume that a domain uses. For more information, see Configuring
                          EBS-based storage (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-createupdatedomains.html#opensearch-createdomain-configure-ebs).
                        type: string
                    type: object
                  encryptionAtRestOptions:
                    description: Key-value pairs to enable encryption at rest.
                    properties:
                      enabled:
                        type: boolean
                      encryptionMode:
                        description: |-
                          The type of encryption at rest applied to a domain's data: DISK for volume-level
                          encryption or NATIVE for engine-native, index-level encryption.
                        type: string
                      kmsKeyID:
                        type: string
                    type: object
                  engineMode:
                    description: The engine mode for the domain. For valid values
                      and requirements, see EngineMode.
                    type: string
                  engineVersion:
                    description: |-
                      String of format Elasticsearch_X.Y or OpenSearch_X.Y to specify the engine
                      version for the OpenSearch Service domain. For example, OpenSearch_1.0 or
                      Elasticsearch_7.9. For more information, see Creating and managing Amazon
                      OpenSearch Service domains (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/createupdatedomains.html#createdomains).
                    type: string
                  identityCenterOptions:
                    description: |-
                      Configuration options for enabling and managing IAM Identity Center integration
                      within a domain.
                    properties:
                      enabledAPIAccess:
                        type: boolean
                      identityCenterInstanceARN:
                        type: string
                      identityCenterInstanceRegion:
                        description: An Amazon Web Services Region, such as us-east-1.
                        type: string
                      rolesKey:
                        type: string
                      subjectKey:
                        type: string
                    type: object
                  ipAddressType:
                    description: |-
                      Specify either dual stack or IPv4 as your IP address type. Dual stack allows
                      you to share domain resources across IPv4 and IPv6 address types, and is
                      the recommended option. If you set your IP address type to dual stack, you
                      can't change your address type later.
                    type: string
                  logPublishingOptions:
                    additionalProperties:
                      properties:
                        cloudWatchLogsLogGroupARN:
                          description: ARN of the Cloudwatch log group to publish
                            logs to.
                          type: string
                        enabled:
                          type: boolean
                      type: object
                    description: Key-value pairs to configure log publishing.
                    type: object
                  masterUserPasswordSecretRef:
                    description: |-
                      MasterUserPasswordSecretRef references the password of the master user
                      of fine-grained access control
                      (advancedSecurityOptions.masterUserOptions.masterUserName), in a secret
                      in the namespace of the Domain. It is sent on create, and on update when
                      it differs from the password in the connection secret
                      (writeConnectionSecretToRef); without a connection secret, changes are
                      not detected.

                      Constraints: 8 to 128 characters, with at least one uppercase letter,
                      one lowercase letter, one number and one special character.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  nodeToNodeEncryptionOptions:
                    description: Enables node-to-node encryption.
                    properties:
                      enabled:
                        type: boolean
                    type: object
                  offPeakWindowOptions:
                    description: |-
                      Specifies a daily 10-hour time block during which OpenSearch Service can
                      perform configuration changes on the domain, including service software updates
                      and Auto-Tune enhancements that require a blue/green deployment. If no options
                      are specified, the default start time of 10:00 P.M. local time (for the Region
                      that the domain is created in) is used.
                    properties:
                      enabled:
                        type: boolean
                      offPeakWindow:
                        description: |-
                          A custom 10-hour, low-traffic window during which OpenSearch Service can
                          perform mandatory configuration changes on the domain. These actions can
                          include scheduled service software updates and blue/green Auto-Tune enhancements.
                          OpenSearch Service will schedule these actions during the window that you
                          specify.

                          If you don't specify a window start time, it defaults to 10:00 P.M. local
                          time.

                          For more information, see Defining off-peak maintenance windows for Amazon
                          OpenSearch Service (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/off-peak.html).
                        properties:
                          windowStartTime:
                            description: The desired start time for an off-peak maintenance
                              window (https://docs.aws.amazon.com/opensearch-service/latest/APIReference/API_OffPeakWindow.html).
                            properties:
                              hours:
                                format: int64
                                type: integer
                              minutes:
                                format: int64
                                type: integer
                            type: object
                        type: object
                    type: object
                  region:
                    description: Region is which region the Domain will be created.
                    type: string
                  snapshotOptions:
                    description: |-
                      DEPRECATED. Container for the parameters required to configure automated
                      snapshots of domain indexes.
                    properties:
                      automatedSnapshotStartHour:
                        format: int64
                        type: integer
                    type: object
                  softwareUpdateOptions:
                    description: Software update options for the domain.
                    properties:
                      autoSoftwareUpdateEnabled:
                        type: boolean
                      useLatestServiceSoftwareForBlueGreen:
                        type: boolean
                    type: object
                  tags:
                    description: List of tags to add to the domain upon creation.
                    items:
                      properties:
                        key:
                          description: |-
                            A string between 1 to 128 characters that specifies the key for a tag. Tag
                            keys must be unique for the domain to which they're attached.
                          type: string
                        value:
                          description: |-
                            A string between 0 to 256 characters that specifies the value for a tag.
                            Tag values can be null and don't have to be unique in a tag set.
                          type: string
                      type: object
                    type: array
                  useCase:
                    description: The primary use case for the domain. For valid values,
                      see DomainUseCase.
                    type: string
                  vpcOptions:
                    description: |-
                      Container for the values required to configure VPC access domains. If you
                      don't specify these values, OpenSearch Service creates the domain with a
                      public endpoint. For more information, see Launching your Amazon OpenSearch
                      Service domains using a VPC (https://docs.aws.amazon.com/opensearch-service/latest/developerguide/vpc.html).
                    properties:
                      egressEnabled:
                        type: boolean
                      securityGroupIDs:
                        items:
                          type: string
                        type: array
                      subnetIDs:
                        items:
                          type: string
                        type: array
                    type: object
                required:
                - region
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: DomainStatus defines the observed state of Domain.
            properties:
              atProvider:
                description: DomainObservation defines the observed state of Domain
                properties:
                  arn:
                    description: |-
                      The Amazon Resource Name (ARN) of the domain. For more information, see IAM
                      identifiers (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html)
                      in the Amazon Web Services Identity and Access Management User Guide.
                    type: string
                  changeProgressDetails:
                    description: Information about a configuration change happening
                      on the domain.
                    properties:
                      changeID:
                        type: string
                      configChangeStatus:
                        type: string
                      initiatedBy:
                        type: string
                      lastUpdatedTime:
                        format: date-time
                        type: string
                      message:
                        type: string
                      startTime:
                        format: date-time
                        type: string
                    type: object
                  created:
                    description: |-
                      Creation status of an OpenSearch Service domain. True if domain creation
                      is complete. False if domain creation is still in progress.
                    type: boolean
                  deleted:
                    description: |-
                      Deletion status of an OpenSearch Service domain. True if domain deletion
                      is complete. False if domain deletion is still in progress. Once deletion
                      is complete, the status of the domain is no longer returned.
                    type: boolean
                  domainEndpointV2HostedZoneID:
                    description: The dual stack hosted zone ID for the domain.
                    type: string
                  domainID:
                    description: Unique identifier for the domain.
                    type: string
                  domainName:
                    description: |-
                      Name of the domain. Domain names are unique across all domains owned by the
                      same account within an Amazon Web Services Region.
                    type: string
                  domainProcessingStatus:
                    description: The status of any changes that are currently in progress
                      for the domain.
                    type: string
                  endpoint:
                    description: |-
                      Domain-specific endpoint used to submit index, search, and data upload requests
                      to the domain.
                    type: string
                  endpointV2:
                    description: |-
                      If IPAddressType to set to dualstack, a version 2 domain endpoint is provisioned.
                      This endpoint functions like a normal endpoint, except that it works with
                      both IPv4 and IPv6 IP addresses. Normal endpoints work only with IPv4 IP
                      addresses.
                    type: string
                  endpoints:
                    additionalProperties:
                      type: string
                    description: |-
                      The key-value pair that exists if the OpenSearch Service domain uses VPC
                      endpoints. For example:

                         * IPv4 IP addresses - 'vpc','vpc-endpoint-h2dsd34efgyghrtguk5gt6j2foh4.us-east-1.es.amazonaws.com'

                         * Dual stack IP addresses - 'vpcv2':'vpc-endpoint-h2dsd34efgyghrtguk5gt6j2foh4.aos.us-east-1.on.aws'
                    type: object
                  modifyingProperties:
                    description: Information about the domain properties that are
                      currently being modified.
                    items:
                      properties:
                        activeValue:
                          type: string
                        name:
                          type: string
                        pendingValue:
                          type: string
                        valueType:
                          type: string
                      type: object
                    type: array
                  processing:
                    description: |-
                      The status of the domain configuration. True if OpenSearch Service is processing
                      configuration changes. False if the configuration is active.
                    type: boolean
                  serviceSoftwareOptions:
                    description: The current status of the domain's service software.
                    properties:
                      automatedUpdateDate:
                        format: date-time
                        type: string
                      cancellable:
                        type: boolean
                      currentVersion:
                        type: string
                      description:
                        type: string
                      newVersion:
                        type: string
                      optionalDeployment:
                        type: boolean
                      updateAvailable:
                        type: boolean
                      updateStatus:
                        type: string
                    type: object
                  upgradeProcessing:
                    description: |-
                      The status of a domain version upgrade to a new version of OpenSearch or
                      Elasticsearch. True if OpenSearch Service is in the process of a version
                      upgrade. False if the configuration is active.
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
